<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Munkaterv</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      text-align: center;
    }

    .container {
      width: min(100% - 32px, 1050px);
      margin: 0 auto;
      padding: 16px 0 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================
       FELSŐ KÉP
       ========================= */

    .header-image {
      display: block;
      width: min(100%, 760px);
      aspect-ratio: 2 / 1;
      height: auto;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .16);
    }


    /* =========================
       MUNKATERV GOMB
       ========================= */

    .munkaterv-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 28px;

      border: 0;
      border-radius: 12px;

      background: #d60000;
      color: #fff;

      font-family: inherit;
      font-size: clamp(17px, 2.2vw, 22px);
      font-weight: 800;
      letter-spacing: 1px;

      cursor: pointer;

      box-shadow: 0 6px 15px rgba(0, 0, 0, .2);

      transition:
        background .2s ease,
        transform .2s ease;
    }

    .munkaterv-btn:hover {
      background: #b80000;
      transform: translateY(-2px);
    }


    /* =========================
       FRISSÍTÉSI DÁTUM
       ========================= */

    .updated {
      margin: 10px 0 22px;
      font-size: clamp(13px, 1.6vw, 16px);
      font-weight: 600;
    }


    /* =========================
       HÁROM KÉP
       ========================= */

    .cards {
      width: 100%;

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      gap: 16px;

      justify-content: center;
    }

    .card {
      display: block;

      width: 100%;
      aspect-ratio: 1 / 1;

      padding: 0;
      border: 0;
      border-radius: 15px;

      overflow: hidden;

      cursor: pointer;

      background: #ddd;

      box-shadow: 0 6px 18px rgba(0, 0, 0, .18);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, .24);
    }

    .card img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    /* =========================
       MODÁLIS ABLAK
       ========================= */

    .modal {
      display: none;

      position: fixed;

      z-index: 9999;

      inset: 0;

      background: rgba(0, 0, 0, .72);

      justify-content: center;
      align-items: center;

      padding: 18px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      position: relative;

      width: min(100%, 500px);

      max-height: 90vh;
      overflow-y: auto;

      padding: 48px 24px 30px;

      background: #fff;

      border-radius: 18px;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, .4);
    }

    .modal-content h2 {
      margin: 0 0 26px;

      font-size: 26px;
    }


    /* =========================
       GITHUB GOMBOK
       ========================= */

    .modal-buttons {
      display: flex;

      justify-content: center;

      gap: 14px;

      flex-wrap: wrap;
    }

    .github-btn {
      display: inline-block;

      flex: 1 1 180px;

      padding: 16px 20px;

      border-radius: 10px;

      background: #24292f;

      color: #fff;

      text-decoration: none;

      font-size: 17px;

      font-weight: 700;

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .github-btn:hover {
      background: #000;

      transform: translateY(-2px);
    }


    /* =========================
       BEZÁRÁS GOMB
       ========================= */

    .close {
      position: absolute;

      right: 15px;
      top: 8px;

      border: 0;

      background: transparent;

      font-size: 38px;

      cursor: pointer;

      color: #444;
    }


    /* =========================
       MUNKATERV MODÁL
       ========================= */

    .workplan-content {
      width: min(100%, 520px);
    }

    .workplan-content h2 {
      margin-bottom: 22px;
    }

    .workplan-item {
      padding: 18px 8px;

      border-top: 1px solid #ddd;
    }

    .workplan-item h3 {
      margin: 0 0 12px;

      font-size: 18px;

      line-height: 1.4;
    }

    /* PIROS MUNKATERV LINK GOMB */

    .workplan-link {
      display: inline-block;

      padding: 11px 22px;

      background: #d60000;

      color: #fff;

      text-decoration: none;

      font-size: 15px;

      font-weight: 700;

      border-radius: 9px;

      box-shadow:
        0 4px 10px rgba(0, 0, 0, .15);

      transition:
        background .2s ease,
        transform .2s ease;
    }

    .workplan-link:hover {
      background: #b80000;

      transform: translateY(-2px);
    }


    /* =========================
       BILLENTYŰZETES FÓKUSZ
       ========================= */

    .munkaterv-btn:focus-visible,
    .card:focus-visible,
    .github-btn:focus-visible,
    .workplan-link:focus-visible,
    .close:focus-visible {
      outline: 3px solid #2274ff;
      outline-offset: 3px;
    }


    /* =========================
       MOBIL
       ========================= */

    @media (max-width: 768px) {

      .container {
        width: min(100% - 28px, 430px);

        padding-top: 10px;
      }

      /* Felső kép */

      .header-image {
        width: 100%;
      }

      /* Munkaterv */

      .munkaterv-btn {
        width: min(100%, 260px);

        padding: 11px 16px;
      }

      .updated {
        margin-bottom: 18px;
      }

      /* Képek egymás alatt */

      .cards {
        grid-template-columns: 1fr;

        gap: 14px;
      }

      .card {
        width: min(100%, 320px);

        justify-self: center;
      }

      /* GitHub modal */

      .modal-buttons {
        flex-direction: column;
      }

      .github-btn {
        width: 100%;

        flex: auto;

        padding: 13px 15px;

        font-size: 15px;
      }

      /* Munkaterv modal */

      .workplan-content {
        width: 100%;

        padding:
          42px 16px
          22px;
      }

      .workplan-content h2 {
        font-size: 22px;
      }

      .workplan-item {
        padding: 14px 5px;
      }

      .workplan-item h3 {
        font-size: 15px;
      }

      .workplan-link {
        width: 100%;

        padding: 11px 12px;
      }
    }
  </style>
</head>


<body>

  <main class="container">


    <!-- =========================
         FELSŐ KÉP
         ========================= -->

    <img
      class="header-image"
      src="focim.png"
      alt="Munkaterv fejléc"
    >


    <!-- =========================
         MUNKATERV GOMB
         ========================= -->

    <button
      class="munkaterv-btn"
      type="button"
      onclick="openWorkplanModal()"
    >
      MUNKATERV
    </button>


    <!-- =========================
         UTOLSÓ FRISSÍTÉS
         ========================= -->

    <div class="updated">

      <b>
        <i>
          Utoljára frissítve:
          2026. szeptember 24. 11:30
        </i>
      </b>

    </div>


    <!-- =========================
         HÁROM TANTÁRGY KÉPE
         ========================= -->

    <section class="cards">


      <!-- =====================
           1. ROBOTIKA II
           ===================== -->

      <button
        class="card"
        type="button"

        onclick="openModal(
          'ROBOTIKA II',
          'https://oroszkristof.github.io/ROBOTIKA-II-EYZWG9-FUEEB7/',
          'https://github.com/oroszkristof/ROBOTIKA-II-EYZWG9-FUEEB7'
        )"

        aria-label="Robotika II megnyitása"
      >

        <img
          src="robotika.png"
          alt="Robotika II"
        >

      </button>


      <!-- =====================
           2. SZOLGÁLTATÁS
           ===================== -->

      <button
        class="card"
        type="button"

        onclick="openModal(
          'SZOLGÁLTATÁS - ORIENTÁLT PROGRAMOZÁS',
          'https://oroszkristof.github.io/SZOLGALTATAS-ORIENTALT-PROGRAMOZAS-EYZWG9-FUEEB7/',
          'https://github.com/oroszkristof/SZOLGALTATAS-ORIENTALT-PROGRAMOZAS-EYZWG9-FUEEB7'
        )"

        aria-label="Szolgáltatás-orientált programozás megnyitása"
      >

        <img
          src="szolgaltatas.png"
          alt="Szolgáltatás-orientált programozás"
        >

      </button>


      <!-- =====================
           3. JÁTÉKFEJLESZTÉS
           ===================== -->

      <button
        class="card"
        type="button"

        onclick="openModal(
          '3D MODELLEZÉS ÉS JÁTÉKFEJLESZTÉS',
          'https://oroszkristof.github.io/3D-MODELLEZES-ES-JATEKFEJLESZTES-EYZWG9-FUEEB7/',
          'https://github.com/oroszkristof/3D-MODELLEZES-ES-JATEKFEJLESZTES-EYZWG9-FUEEB7'
        )"

        aria-label="3D modellezés és játékfejlesztés megnyitása"
      >

        <img
          src="jatekfejlesztes.png"
          alt="3D modellezés és játékfejlesztés"
        >

      </button>

    </section>

  </main>



  <!-- ==========================================
       PROJEKT / GITHUB MODÁL
       ========================================== -->

  <div
    id="projectModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >

    <div class="modal-content">


      <!-- Bezárás -->

      <button
        class="close"
        type="button"
        onclick="closeModal()"
        aria-label="Bezárás"
      >
        &times;
      </button>


      <!-- Tantárgy neve -->

      <h2 id="modalTitle">
        Projekt
      </h2>


      <!-- GitHub gombok -->

      <div class="modal-buttons">

        <a
          id="githubPage"
          class="github-btn"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub oldal
        </a>


        <a
          id="githubRepo"
          class="github-btn"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub repó
        </a>

      </div>

    </div>

  </div>



  <!-- ==========================================
       MUNKATERV MODÁL
       ========================================== -->

  <div
    id="workplanModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="workplanTitle"
  >

    <div class="modal-content workplan-content">


      <!-- Bezárás -->

      <button
        class="close"
        type="button"
        onclick="closeWorkplanModal()"
        aria-label="Bezárás"
      >
        &times;
      </button>


      <h2 id="workplanTitle">
        MUNKATERV
      </h2>


      <!-- =====================
           ROBOTIKA II
           ===================== -->

      <div class="workplan-item">

        <h3>
          ROBOTIKA II
          <br><p style="font-size: 12px;"><b><i>Utoljára frissítve: 2026. szeptember 24. 11:30</i></b></p>
        </h3>

        <a
          class="workplan-link"
          href="https://drive.google.com/file/d/1oiFRpT0MMse7sWXJmS6GIinxJerYGLmh/view?usp=sharing"
          target="_blank"
          rel="noopener noreferrer"
        >
          MEGNÉZEM
        </a>

      </div>


      <!-- =====================
           SZOLGÁLTATÁS
           ===================== -->

      <div class="workplan-item">

        <h3>
          SZOLGÁLTATÁS - ORIENTÁLT PROGRAMOZÁS
        </h3>

        <a
          class="workplan-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          Nem elérhető...
        </a>

      </div>


      <!-- =====================
           JÁTÉKFEJLESZTÉS
           ===================== -->

      <div class="workplan-item">

        <h3>
          3D MODELLEZÉS ÉS JÁTÉKFEJLESZTÉS
        </h3>

        <a
          class="workplan-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          Nem elérhető...
        </a>

      </div>

    </div>

  </div>



  <!-- ==========================================
       JAVASCRIPT
       ========================================== -->

  <script>

    /* =========================
       PROJEKT MODÁL
       ========================= */

    const modal =
      document.getElementById("projectModal");

    const modalTitle =
      document.getElementById("modalTitle");

    const githubPage =
      document.getElementById("githubPage");

    const githubRepo =
      document.getElementById("githubRepo");


    function openModal(
      title,
      pageUrl,
      repoUrl
    ) {

      modalTitle.textContent = title;

      githubPage.href = pageUrl;

      githubRepo.href = repoUrl;

      modal.classList.add("show");

      document.body.style.overflow = "hidden";

    }


    function closeModal() {

      modal.classList.remove("show");

      document.body.style.overflow = "";

    }


    /* Háttérre kattintva bezár */

    modal.addEventListener(
      "click",
      function(event) {

        if (event.target === modal) {

          closeModal();

        }

      }
    );



    /* =========================
       MUNKATERV MODÁL
       ========================= */

    const workplanModal =
      document.getElementById("workplanModal");


    function openWorkplanModal() {

      workplanModal.classList.add("show");

      document.body.style.overflow = "hidden";

    }


    function closeWorkplanModal() {

      workplanModal.classList.remove("show");

      document.body.style.overflow = "";

    }


    /* Háttérre kattintva bezár */

    workplanModal.addEventListener(
      "click",
      function(event) {

        if (event.target === workplanModal) {

          closeWorkplanModal();

        }

      }
    );



    /* =========================
       ESC = BEZÁRÁS
       ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeModal();

          closeWorkplanModal();

        }

      }
    );

  </script>

</body>

</html>
